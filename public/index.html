<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deck DevSecOps</title>
    <link rel="icon" type="image/png" href="/img/icon-64.png">
    <link rel="apple-touch-icon" href="/img/icon-180.png">
    <link rel="stylesheet" href="/vendor/xterm.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1><img src="/img/icon-64.png" alt="" width="22" height="22">Deck DevSecOps</h1>
        <nav id="crumbs" aria-label="Rubrique"></nav>
        <p class="legend">
            <span class="dot run"></span> exécutée
            <span class="dot type"></span> tapée, à compléter
        </p>
        <button id="palette-open" class="palette-open" title="Chercher une touche ou une commande"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g></svg><span>Rechercher</span><kbd class="kbd-mod">⌘K</kbd></button>
        <span id="conn" class="conn" title="Connexion au serveur">connexion…</span>
    </header>

    <main>
        <section id="deck" aria-label="Touches">
            <div id="grid" class="grid"></div>
        </section>

        <section id="term" aria-label="Terminal">
            <div class="tabs">
                <div id="tabs" role="tablist"></div>
                <button id="new-tab" class="tab-add" title="Nouveau terminal">+</button>
                <div id="layouts" class="layouts" role="group" aria-label="Disposition des terminaux">
                    <button data-layout="tabs" title="1 terminal (onglets)" aria-pressed="false"><svg viewBox="0 0 20 14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1" y="1" width="18" height="12" rx="2"/></g></svg></button>
                    <button data-layout="2x1" title="2 terminaux côte à côte (2×1)" aria-pressed="false"><svg viewBox="0 0 20 14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1" y="1" width="18" height="12" rx="2"/><path d="M10 1v12"/></g></svg></button>
                    <button data-layout="2x2" title="4 terminaux en grille (2×2)" aria-pressed="false"><svg viewBox="0 0 20 14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1" y="1" width="18" height="12" rx="2"/><path d="M10 1v12M1 7h18"/></g></svg></button>
                </div>
                <div class="tools" role="group" aria-label="Outils des terminaux">
                    <button id="broadcast" class="tool" title="Diffusion : taper dans tous les terminaux visibles à la fois" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h10"/><path d="m17 3 3 3-3 3M17 15l3 3-3 3"/></g></svg></button>
                    <button id="notify" class="tool" title="Notification quand une commande longue se termine" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></g></svg></button>
                    <button id="search-open" class="tool" title="Rechercher dans le terminal (⌘F / Ctrl+F)"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g></svg></button>
                    <button id="font-down" class="tool txt" title="Texte plus petit (⌘− / Ctrl+−)">A−</button>
                    <button id="font-up" class="tool txt" title="Texte plus grand (⌘+ / Ctrl++)">A+</button>
                </div>
                <select id="shell" title="Shell des nouveaux terminaux"></select>
            </div>
            <div id="screens">
                <div id="searchbar" class="searchbar" hidden>
                    <input id="search-input" type="search" placeholder="Rechercher dans le terminal" spellcheck="false" autocomplete="off">
                    <button id="search-prev" title="Précédent (Maj+Entrée)">↑</button>
                    <button id="search-next" title="Suivant (Entrée)">↓</button>
                    <button id="search-close" title="Fermer (Échap)">×</button>
                </div>
            </div>
        </section>
    </main>

    <div id="picker" class="picker" hidden></div>

    <div id="palette" class="palette" hidden>
        <div class="palette-box" role="dialog" aria-label="Palette de commandes">
            <input id="palette-input" type="text" placeholder="Chercher une touche : exec, plan, logs, push…" spellcheck="false" autocomplete="off">
            <ul id="palette-list"></ul>
            <p class="palette-help">↑ ↓ choisir · Entrée lancer · Échap fermer</p>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
</body>
</html>
