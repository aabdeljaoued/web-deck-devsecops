# Tests automatiques (npm test) sur Windows, macOS et Linux à chaque push et pull request :
# les régressions propres à un système sont vues sans tester à la main sur chaque machine.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Dépendances
        run: npm ci --omit=dev
      - name: Tests
        run: npm test
